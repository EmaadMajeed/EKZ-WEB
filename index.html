<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101d19">
    <title>EKZ Technologies</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Inter', system-ui, sans-serif;
        color: #edf6eb;
        background: #101d19;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        box-sizing: border-box;
        display: grid;
        align-items: center;
        padding: clamp(1.5rem, 8vw, 8rem);
        background: radial-gradient(ellipse at 80% 25%, #294c3b, transparent 60%);
      }

      main { max-width: 54rem; }

      h1 {
        margin: 0;
        padding-top: 1.5rem;
        border-top: 2px solid #a5eab6;
        font-size: clamp(2.75rem, 8vw, 7rem);
        line-height: 1.05;
        letter-spacing: -0.06em;
      }

      p {
        margin: 1.25rem 0 0;
        color: #bfd5c7;
        font-size: clamp(1rem, 2.5vw, 1.35rem);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>EKZ Technologies</h1>
      <p>Our website is coming soon.</p>
    </main>
  </body>
</html>
